services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cocos
      POSTGRES_PASSWORD: cocos
      POSTGRES_DB: cocos
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      # Init scripts run once, in name order: provided data first, then our migration.
      - ./database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
      - ./db/migrations/001_integrity_and_indexes.sql:/docker-entrypoint-initdb.d/02-migration.sql:ro
    healthcheck:
      # Over TCP: during init Postgres only listens on the socket, so this stays
      # unhealthy until the seed and migration are done.
      test: ['CMD-SHELL', 'pg_isready -h localhost -U cocos -d cocos']
      interval: 2s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgres://cocos:cocos@db:5432/cocos
      PORT: 3000
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
